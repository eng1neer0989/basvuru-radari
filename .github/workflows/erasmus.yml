name: Basvuru Radari - Erasmus

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  erasmus-kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gerekli paketleri kur
        run: |
          pip install requests beautifulsoup4

      - name: Erasmus scraper çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python erasmus_scraper.py

      - name: Veritabanını kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add basvuru_radari.db
          git diff --cached --quiet || git commit -m "Erasmus duyuruları güncellendi"
          git push