name: Basvuru Radari - MCBU

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  mcbu-kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kutuphaneleri kur
        run: |
          pip install requests beautifulsoup4

      - name: MCBU duyurularini kontrol et
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python mcbu_scraper.py